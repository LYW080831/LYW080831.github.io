<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致郑永康</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff8fab, #ffc0cb, #ffe6ee);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft Yahei", sans-serif;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            animation: float 6s infinite ease-in-out;
            user-select: none;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        .box {
            background: rgba(255,255,255,0.85);
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 60, 100, 0.25);
            text-align: center;
            max-width: 520px;
            z-index: 10;
        }
        h1 {
            color: #d82b58;
            font-size: 32px;
            margin-bottom: 24px;
        }
        p {
            font-size: 18px;
            color: #444;
            line-height: 2;
            margin-bottom:12px;
        }
        .end-text {
            margin-top:30px;
            font-size:20px;
            color:#c41e4a;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>💌 致zmjjkk</h1>
        <p>都是同龄人我原本没想降维打击。</p>
        <p>遇到我们你才是挑战者。</p>
        <p>vctcn你们的王回来了。</p>
        <p>我从山中来，带着兰花草。</p>
        <div class="end-text">康神开播了，真的假的？❤️</div>
    </div>

    <script>
        // 生成随机飘落爱心
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (4 + Math.random() *4) + 's';
            heart.style.fontSize = (14 + Math.random()*22)+'px';
            document.body.appendChild(heart);

            setTimeout(()=>{
                heart.remove();
            },8000)
        }
        setInterval(createHeart,400);
    </script>
</body>
</html>
